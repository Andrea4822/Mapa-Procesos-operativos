<!DOCTYPE html>
<html lang="es">
 
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa de Tareas</title>
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
 
<body>
 
  <!-- HEADER -->
  <header>
    <div class="header-left">
      <span class="logo">Operations Specialist</span>
      <span class="tag-count" id="task-count">0 tareas</span>
    </div>
    <div class="header-actions">
      <button class="btn" onclick="openSettings()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <circle cx="12" cy="12" r="3" />
          <path
            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
        </svg>
        Ajustes
      </button>
      <button class="btn btn-primary" onclick="openAddModal()">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <line x1="12" y1="5" x2="12" y2="19" />
          <line x1="5" y1="12" x2="19" y2="12" />
        </svg>
        Nueva tarea
      </button>
    </div>
  </header>
 
  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-value" id="stat-total">0</span>
      <span class="stat-label">Total tareas</span>
    </div>
    <div class="stat-item">
      <span class="stat-value" id="stat-flow">0</span>
      <span class="stat-label">Con flujo</span>
    </div>
  
  </div>
 
 
  <!-- CONTROLS -->
  <div class="controls">
    <div class="search-wrap">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
        <circle cx="11" cy="11" r="8" />
        <line x1="21" y1="21" x2="16.65" y2="16.65" />
      </svg>
      <input type="text" id="search-input" placeholder="Buscar tareas..." oninput="filterTasks()">
    </div>
    <div class="filter-pills" id="filter-pills"></div>
  </div>
 
  <!-- GRID -->
  <div class="grid" id="task-grid"></div>
 
  <!-- ADD / EDIT MODAL -->
  <div class="modal-overlay" id="task-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title" id="modal-title">Nueva tarea</span>
        <button class="icon-btn" onclick="closeModal('task-modal')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="edit-id">
        <div>
          <label>Nombre de la tarea *</label>
          <input type="text" id="f-name" placeholder="Ej: Revisión de contratos">
        </div>
        <div>
          <label>Descripción</label>
          <textarea id="f-desc" rows="2" placeholder="Breve descripción de qué hace esta tarea..."></textarea>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
          <div>
            <label>Tiempo estimado *</label>
            <input type="text" id="f-time" placeholder="Ej: 30 minutos, 1-2 horas">
          </div>
          <div>
            <label>Categoría</label>
            <select id="f-cat"></select>
          </div>
        </div>
        <div>
          <label>Flujo paso a paso (uno por línea)</label>
          <textarea id="f-flow" rows="6"
            placeholder="Ir a glow&#10;Click en Staffing&#10;Click en staff request&#10;..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal('task-modal')">Cancelar</button>
        <button class="btn btn-primary" onclick="saveTask()">Guardar tarea</button>
      </div>
    </div>
  </div>
 
  <!-- SETTINGS MODAL -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal">
      <div class="modal-header">
        <span class="modal-title">Ajustes visuales</span>
        <button class="icon-btn" onclick="closeModal('settings-modal')">
          <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="settings-section">
          <h3>Color de acento</h3>
          <div class="accent-options" id="accent-options"></div>
        </div>
        <div class="settings-section">
          <h3>Tamaño de cuadrícula</h3>
          <div style="display:flex; gap:10px; align-items:center;">
            <label style="margin:0; white-space:nowrap;">Columnas mínimas:</label>
            <input type="range" min="220" max="420" step="10" id="grid-size" style="flex:1;"
              oninput="document.getElementById('grid-size-val').textContent=this.value+'px'; applyGridSize(this.value)">
            <span id="grid-size-val" style="font-size:12px; color:var(--text-muted); min-width:50px;">310px</span>
          </div>
        </div>
        <div class="settings-section">
          <h3>Exportar / Importar datos</h3>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn" onclick="exportData()">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="7 10 12 15 17 10" />
                <line x1="12" y1="15" x2="12" y2="3" />
              </svg>
              Exportar JSON
            </button>
            <label class="btn" style="cursor:pointer;">
              <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                <polyline points="17 8 12 3 7 8" />
                <line x1="12" y1="3" x2="12" y2="15" />
              </svg>
              Importar JSON
              <input type="file" accept=".json" onchange="importData(event)" style="display:none;">
            </label>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-danger"
          onclick="if(confirm('¿Eliminar todas las tareas? Esta acción no se puede deshacer.')){tasks=[];saveTasks();renderTasks();}">Borrar
          todo</button>
        <button class="btn btn-primary" onclick="closeModal('settings-modal')">Listo</button>
      </div>
    </div>
  </div>
 
  <script src="script.js"></script>
</body>
 
</html>
